<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-glow" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#150a2a" />
      <stop offset="45%" stop-color="#090514" />
      <stop offset="100%" stop-color="#020205" />
    </radialGradient>

    <!-- Metallic Glow Multi-Color Swirl Gradient -->
    <linearGradient id="neon-stream-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="25%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="75%" stop-color="#d946ef" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <linearGradient id="neon-stream-2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="30%" stop-color="#06b6d4" />
      <stop offset="65%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- White Chrome Gloss Overlay -->
    <linearGradient id="chrome-gloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="70%" stop-color="#a5f3fc" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.6" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="outer-halo" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="28" result="glow" />
    </filter>
  </defs>

  <!-- Base App Tile Background (Obsidian Black) -->
  <rect width="512" height="512" rx="128" fill="url(#bg-glow)" stroke="#8b5cf6" stroke-opacity="0.3" stroke-width="4" />

  <!-- Outer Neon Ring Glows (Blue, Purple, Green) -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="url(#neon-stream-1)" stroke-width="8" opacity="0.3" filter="url(#outer-halo)" />
  
  <!-- Outer Metallic Bezel Ring -->
  <circle cx="256" cy="256" r="165" fill="none" stroke="url(#neon-stream-1)" stroke-width="4" stroke-dasharray="14 8" opacity="0.7" />

  <!-- Inner Ambient Neon Orbs -->
  <circle cx="160" cy="170" r="80" fill="#00f2fe" opacity="0.18" filter="url(#outer-halo)" />
  <circle cx="340" cy="180" r="85" fill="#a855f7" opacity="0.22" filter="url(#outer-halo)" />
  <circle cx="256" cy="340" r="90" fill="#10b981" opacity="0.2" filter="url(#outer-halo)" />

  <!-- 3D Geometric "N" & Futuristic Hexagon Lens Emblem -->
  <g filter="url(#neon-glow)">
    <!-- Dynamic Glowing Swirl Shape (Blue -> Purple -> Green) -->
    <path d="M140,360 L140,165 C140,145 160,135 178,146 L335,260 C345,267 360,260 360,245 L360,150" 
          fill="none" 
          stroke="url(#neon-stream-1)" 
          stroke-width="36" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <path d="M372,152 L372,347 C372,367 352,377 334,366 L177,252 C167,245 152,252 152,267 L152,362" 
          fill="none" 
          stroke="url(#neon-stream-2)" 
          stroke-width="26" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Center Glowing Diamond / Nova Starburst (White Platinum Core) -->
    <polygon points="256,185 295,256 256,327 217,256" fill="#ffffff" opacity="0.95" />
    <polygon points="256,210 280,256 256,302 232,256" fill="#a5f3fc" />
    <circle cx="256" cy="256" r="14" fill="#ffffff" />
  </g>

  <!-- Glossy Metallic Light Flare (Diagonal Reflection) -->
  <path d="M128,64 Q256,32 384,64 Q256,192 128,64 Z" fill="url(#chrome-gloss)" opacity="0.35" />
  <circle cx="256" cy="256" r="6" fill="#ffffff" filter="url(#neon-glow)" />

  <!-- Micro Orbit Rings -->
  <ellipse cx="256" cy="256" rx="120" ry="42" fill="none" stroke="#00f2fe" stroke-width="2" opacity="0.5" transform="rotate(-30 256 256)" />
  <ellipse cx="256" cy="256" rx="120" ry="42" fill="none" stroke="#10b981" stroke-width="2" opacity="0.5" transform="rotate(30 256 256)" />
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#180a30"/>
      <stop offset="60%" stop-color="#090314"/>
      <stop offset="100%" stop-color="#020008"/>
    </radialGradient>

    <!-- Neon Purple & Blue Gradients -->
    <linearGradient id="purple-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <linearGradient id="cube-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b0764"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <linearGradient id="cube-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#11052c"/>
      <stop offset="100%" stop-color="#080214"/>
    </linearGradient>

    <linearGradient id="cube-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1035"/>
      <stop offset="100%" stop-color="#0c0418"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="neon-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="subtle-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base Rounded App Icon Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)" stroke="#a855f7" stroke-width="4" stroke-opacity="0.5"/>

  <!-- Holographic Ambient Flare -->
  <circle cx="256" cy="256" r="160" fill="#a855f7" opacity="0.15" filter="url(#neon-glow)"/>
  <circle cx="340" cy="180" r="100" fill="#06b6d4" opacity="0.12" filter="url(#neon-glow)"/>

  <!-- Orbital Cyber Rings (Isometric 3D) -->
  <ellipse cx="256" cy="256" rx="200" ry="76" fill="none" stroke="url(#purple-cyan)" stroke-width="3.5" stroke-dasharray="14 8" opacity="0.75" transform="rotate(-24 256 256)"/>
  <ellipse cx="256" cy="256" rx="210" ry="80" fill="none" stroke="#06b6d4" stroke-width="2.5" stroke-opacity="0.6" transform="rotate(32 256 256)"/>

  <!-- 3D Isometric Center Cube -->
  <g transform="translate(256, 256) scale(1.15)">
    <!-- Top Face -->
    <polygon points="0,-90 90,-38 0,14 -90,-38" fill="url(#cube-top)" stroke="#c084fc" stroke-width="3" filter="url(#subtle-glow)"/>
    <!-- Left Face -->
    <polygon points="-90,-38 0,14 0,116 -90,64" fill="url(#cube-left)" stroke="#818cf8" stroke-width="3"/>
    <!-- Right Face -->
    <polygon points="0,14 90,-38 90,64 0,116" fill="url(#cube-right)" stroke="#06b6d4" stroke-width="3"/>

    <!-- Dynamic 3D Inner Glow Coordinates -->
    <line x1="0" y1="14" x2="0" y2="116" stroke="#c084fc" stroke-width="2" opacity="0.8"/>
    <line x1="0" y1="14" x2="-90" y2="-38" stroke="#c084fc" stroke-width="2" opacity="0.8"/>
    <line x1="0" y1="14" x2="90" y2="-38" stroke="#06b6d4" stroke-width="2" opacity="0.8"/>

    <!-- "N A" Bold 3D Holographic Typography -->
    <g transform="translate(0, 42)">
      <!-- Outer Glow Silhouette -->
      <text x="0" y="0" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="44" fill="#a855f7" filter="url(#neon-glow)" letter-spacing="4">N A</text>
      <!-- Crisp Foreground Monogram -->
      <text x="0" y="0" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="44" fill="#ffffff" letter-spacing="4">N A</text>
      <!-- Subtext VIP -->
      <text x="0" y="24" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="14" fill="#38bdf8" letter-spacing="6">VIP 3D</text>
    </g>
  </g>

  <!-- Floating Sparkles & Orbital Nodes -->
  <circle cx="110" cy="190" r="5" fill="#38bdf8" filter="url(#neon-glow)"/>
  <circle cx="410" cy="310" r="6" fill="#ec4899" filter="url(#neon-glow)"/>
  <circle cx="390" cy="140" r="4.5" fill="#facc15" filter="url(#neon-glow)"/>
  <circle cx="120" cy="370" r="4" fill="#a855f7" filter="url(#neon-glow)"/>

  <!-- Top Crown Accent -->
  <g transform="translate(256, 92) scale(0.9)">
    <polygon points="0,-18 14,8 24,-12 18,16 -18,16 -24,-12 -14,8" fill="url(#gold-grad)" filter="url(#subtle-glow)"/>
  </g>
</svg>
